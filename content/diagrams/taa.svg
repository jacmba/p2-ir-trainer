<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="380" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Aproximación RNAV en T y áreas del TAA</text>
  <path d="M470,190 L470,46 A144,144 0 0 0 340,128 Z" fill="#dbeafe"/>
  <path d="M470,190 L470,334 A144,144 0 0 1 340,252 Z" fill="#fef3c7"/>
  <path d="M470,190 L340,128 A144,144 0 0 0 340,252 Z" fill="#dcfce7"/>
  <text x="375" y="72" font-size="12" font-weight="bold" fill="#1e3a8a">BASE IZQUIERDA</text>
  <text x="378" y="318" font-size="12" font-weight="bold" fill="#92400e">BASE DERECHA</text>
  <text x="250" y="186" font-size="12" font-weight="bold" fill="#166534">DIRECTA</text>
  <text x="236" y="202" font-size="11" fill="#166534">arco 30 NM</text>
  <rect x="660" y="184" width="70" height="12" fill="#334155"/><text x="695" y="214" text-anchor="middle" font-size="11">umbral (MAPt)</text>
  <line x1="470" y1="190" x2="655" y2="190" stroke="#1e3a8a" stroke-width="3.5" marker-end="url(#a)"/>
  <line x1="470" y1="96" x2="470" y2="186" stroke="#1e3a8a" stroke-width="3" marker-end="url(#a)"/>
  <line x1="470" y1="284" x2="470" y2="194" stroke="#1e3a8a" stroke-width="3" marker-end="url(#a)"/>
  <g font-size="12" font-weight="bold">
    <circle cx="470" cy="190" r="6" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="440" y="180">IF/IAF</text>
    <circle cx="565" cy="190" r="6" fill="#0f172a"/><text x="553" y="178">FAF</text>
    <circle cx="470" cy="96" r="6" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="480" y="92">IAF</text>
    <circle cx="470" cy="284" r="6" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="480" y="296">IAF</text>
