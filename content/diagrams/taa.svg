  <text x="590" y="236" font-size="11.5" fill="#475569">FAF a 5 NM del umbral</text>
  <text x="500" y="236" font-size="11.5" fill="#475569" text-anchor="end">IF 5 NM más</text>
  <text x="480" y="140" font-size="11.5" fill="#475569">3–6 NM, a 90° (en Y, 70°)</text>
  <text x="20" y="350" font-size="12" fill="#0f172a">Segmento inicial mín. 3 NM (CAT A) – 6 NM (CAT E). Frustrada alineada con el final y entrada directa a una espera.</text>
  <text x="20" y="370" font-size="12" fill="#0f172a">Sin IAF laterales y con viraje de más de 120° en el IF → entrada en la espera del IF.</text>
