<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="330" fill="#f8fafc"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Reglas de interceptación según la diferencia (P)</text>
  <text x="20" y="62" font-size="13" font-weight="bold" fill="#1e3a8a">ACERCAMIENTO · cabeza del RMI frente al curso deseado</text>
  <g font-size="12">
    <rect x="20" y="74" width="120" height="58" rx="5" fill="#dbeafe"/><text x="80" y="96" text-anchor="middle" font-weight="bold">&lt; 15°</text><text x="80" y="116" text-anchor="middle">Doble P</text>
    <rect x="150" y="74" width="200" height="58" rx="5" fill="#bfdbfe"/><text x="250" y="96" text-anchor="middle" font-weight="bold">15° – 60°</text><text x="250" y="116" text-anchor="middle">Deseado – Cabeza – 30°</text>
    <rect x="360" y="74" width="170" height="58" rx="5" fill="#93c5fd"/><text x="445" y="96" text-anchor="middle" font-weight="bold">60° – 90°</text><text x="445" y="116" text-anchor="middle">hasta 90° de corte</text>
    <rect x="540" y="74" width="200" height="58" rx="5" fill="#fecaca"/><text x="640" y="96" text-anchor="middle" font-weight="bold">&gt; 90° · ruta pasada</text><text x="640" y="116" text-anchor="middle">rumbo radial → cuadra → 90°+90°</text>
  </g>
  <text x="20" y="152" font-size="11.5" fill="#475569">135→145: 115° · 250→210: 280° · 330→045: 315° · R180→curso 210: rumbo 030° hasta la cuadra</text>
  <text x="20" y="192" font-size="13" font-weight="bold" fill="#b45309">ALEJAMIENTO · cola del RMI frente al radial deseado</text>
  <g font-size="12">
    <rect x="20" y="204" width="120" height="58" rx="5" fill="#fef3c7"/><text x="80" y="226" text-anchor="middle" font-weight="bold">&lt; 15°</text><text x="80" y="246" text-anchor="middle">Radial deseado – P</text>
    <rect x="150" y="204" width="380" height="58" rx="5" fill="#fde68a"/><text x="340" y="226" text-anchor="middle" font-weight="bold">15° – 90°</text><text x="340" y="246" text-anchor="middle">Radial deseado – 45°</text>
    <rect x="540" y="204" width="200" height="58" rx="5" fill="#fecaca"/><text x="640" y="226" text-anchor="middle" font-weight="bold">&gt; 90° · ruta pasada</text><text x="640" y="246" text-anchor="middle">rumbo = radial → cuadra → 45°</text>
  </g>
  <text x="20" y="282" font-size="11.5" fill="#475569">R320→R330: 340° · R120→R050: 005° · rumbo 090, salir por R240: rumbo 240 hasta la cuadra y luego 195°</text>
  <text x="20" y="316" font-size="12" fill="#0f172a">Se mira primero el curso deseado (CDI), luego la aguja del RMI, y se sigue en ese sentido. Ángulo de corte máximo: 90°.</text>
</svg>
