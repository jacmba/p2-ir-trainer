<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="400" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e3a8a"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Arco DME de 13 NM de MTA (ejemplo del curso: GS 120 kt, viraje estándar)</text>
  <text x="500" y="65" text-anchor="middle" font-size="11" fill="#475569">N ↑</text>
  <circle cx="500" cy="205" r="130.0" fill="none" stroke="#cbd5e1" stroke-dasharray="2 5"/>
  <path d="M445.1,322.8 A130.0,130.0 0 0 1 379.5,156.3" fill="none" stroke="#1e3a8a" stroke-width="4"/>
  <line x1="385.3" y1="368.8" x2="422.0" y2="316.4" stroke="#0f172a" stroke-width="3" marker-end="url(#a)"/>
  <path d="M422.0,316.4 Q423.0,311.0 414.7,303.1" fill="none" stroke="#b45309" stroke-width="3"/>
  <circle cx="422.0" cy="316.4" r="5" fill="#b45309"/>
  <line x1="370.3" y1="195.9" x2="488.0" y2="204.2" stroke="#0f172a" stroke-width="3" marker-end="url(#a)"/>
  <circle cx="370.0" cy="202.7" r="5" fill="#15803d"/>
  <circle cx="500" cy="205" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="512" y="225" font-size="12" font-weight="bold">VOR/DME MTA</text>
  <text x="377" y="373" text-anchor="end" font-size="12">R-215 en acercamiento</text>
  <text x="436" y="322" font-size="12.5" font-weight="bold" fill="#b45309">viraje a 13,6 NM</text>
  <text x="436" y="337" font-size="11.5" fill="#b45309">anticipo 0,5 % × 120 = 0,6 NM (en alejamiento: 12,4)</text>
  <text x="367" y="254" text-anchor="end" font-size="13" font-weight="bold" fill="#1e3a8a">arco 13 NM</text>
  <text x="367" y="269" text-anchor="end" font-size="11.5" fill="#1e3a8a">radiales crecientes</text>
  <text x="364" y="175" font-size="12.5" font-weight="bold" fill="#15803d">salida al curso 094 (R-274)</text>
  <text x="364" y="190" font-size="11.5" fill="#15803d">60 × 0,6 / 13 = 2,77 ≈ 3° → virar con la cola en 271</text>
  <rect x="20" y="60" width="215" height="88" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="30" y="80" font-size="12" font-weight="bold">Mantener el arco (± 0,5 NM)</text>
  <text x="30" y="97" font-size="11.5">Aguja del RMI en la punta de ala.</text>
  <text x="30" y="113" font-size="11.5">Tramos rectos: 10° arriba → 5° abajo.</text>
  <text x="30" y="129" font-size="11">0,5 NM hacia dentro: 5° más abajo</text>
  <text x="30" y="142" font-size="11">0,5 NM hacia fuera: 10° más arriba</text>
</svg>
