<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="760" height="300" fill="#f8fafc"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Técnicas de cross-check (panel básico de seis instrumentos)</text>
  <g transform="translate(20,50)">
    <text x="110" y="0" text-anchor="middle" font-size="13" font-weight="bold">RADIAL</text>
    <g fill="#fff" stroke="#94a3b8"><circle cx="40" cy="50" r="26"/><circle cx="110" cy="50" r="26" fill="#fef3c7" stroke="#b45309"/><circle cx="180" cy="50" r="26"/><circle cx="40" cy="130" r="26"/><circle cx="110" cy="130" r="26"/><circle cx="180" cy="130" r="26"/></g>
    <g font-size="9.5" text-anchor="middle"><text x="40" y="54">VEL</text><text x="110" y="54">ACTITUD</text><text x="180" y="54">ALT</text><text x="40" y="134">VIRAJE</text><text x="110" y="134">RUMBO</text><text x="180" y="134">VSI</text></g>
    <g stroke="#b45309" stroke-width="2" marker-end="url(#a)"><line x1="86" y1="50" x2="68" y2="50"/><line x1="134" y1="50" x2="152" y2="50"/><line x1="110" y1="76" x2="110" y2="102"/><line x1="92" y1="68" x2="60" y2="108"/><line x1="128" y1="68" x2="160" y2="108"/></g>
    <text x="110" y="182" text-anchor="middle" font-size="11.5">80–90 % en la actitud;</text>
    <text x="110" y="197" text-anchor="middle" font-size="11.5">siempre se vuelve por ella</text>
  </g>
  <g transform="translate(270,50)">
    <text x="110" y="0" text-anchor="middle" font-size="13" font-weight="bold">RECTANGULAR</text>
    <g fill="#fff" stroke="#94a3b8"><circle cx="40" cy="50" r="26"/><circle cx="110" cy="50" r="26"/><circle cx="180" cy="50" r="26"/><circle cx="40" cy="130" r="26"/><circle cx="110" cy="130" r="26"/><circle cx="180" cy="130" r="26"/></g>
    <g font-size="9.5" text-anchor="middle"><text x="40" y="54">VEL</text><text x="110" y="54">ACTITUD</text><text x="180" y="54">ALT</text><text x="40" y="134">VIRAJE</text><text x="110" y="134">RUMBO</text><text x="180" y="134">VSI</text></g>
    <g stroke="#b45309" stroke-width="2" marker-end="url(#a)"><line x1="67" y1="50" x2="82" y2="50"/><line x1="137" y1="50" x2="152" y2="50"/><line x1="180" y1="77" x2="180" y2="102"/><line x1="153" y1="130" x2="138" y2="130"/><line x1="83" y1="130" x2="68" y2="130"/><line x1="40" y1="103" x2="40" y2="78"/></g>
    <text x="110" y="182" text-anchor="middle" font-size="11.5">mismo tiempo a todos; tarda</text>
    <text x="110" y="197" text-anchor="middle" font-size="11.5">en volver al instrumento crítico</text>
  </g>
  <g transform="translate(520,50)">
    <text x="110" y="0" text-anchor="middle" font-size="13" font-weight="bold">V INVERTIDA</text>
    <g fill="#fff" stroke="#94a3b8"><circle cx="40" cy="50" r="26"/><circle cx="110" cy="50" r="26" fill="#fef3c7" stroke="#b45309"/><circle cx="180" cy="50" r="26"/><circle cx="40" cy="130" r="26" fill="#fef3c7" stroke="#b45309"/><circle cx="110" cy="130" r="26"/><circle cx="180" cy="130" r="26" fill="#fef3c7" stroke="#b45309"/></g>
    <g font-size="9.5" text-anchor="middle"><text x="40" y="54">VEL</text><text x="110" y="54">ACTITUD</text><text x="180" y="54">ALT</text><text x="40" y="134">VIRAJE</text><text x="110" y="134">RUMBO</text><text x="180" y="134">VSI</text></g>
    <g stroke="#b45309" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M94,70 L58,110"/><path d="M50,106 L88,68" stroke-dasharray="4 3"/><path d="M126,70 L162,110"/><path d="M170,106 L132,68" stroke-dasharray="4 3"/></g>
    <text x="110" y="182" text-anchor="middle" font-size="11.5">actitud → viraje → actitud →</text>
    <text x="110" y="197" text-anchor="middle" font-size="11.5">variómetro → actitud</text>
  </g>
  <text x="20" y="270" font-size="12" fill="#475569">Con panel parcial (actitud averiada), el coordinador de viraje pasa a ser instrumento principal.</text><text x="20" y="288" font-size="12" fill="#475569">En un PFD se hace un cross-check radial, igualmente centrado en la actitud.</text>
</svg>
